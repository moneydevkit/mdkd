[package]
name = "mdk-server"
version = "0.0.1"
edition = "2021"

[features]
demo = []

[dependencies]
ldk-server = { git = "https://github.com/moneydevkit/ldk-server", rev = "a17acc8f0b0c7803562ffdfa2e7cc87f85b12c31" }

axum = { version = "0.8", features = ["json", "ws"] }
utoipa = { version = "5.4", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "socks"], default-features = false }
rusqlite = { version = "0.31.0", features = ["bundled"] }
hex = { package = "hex-conservative", version = "0.2.1" }
clap = { version = "4", features = ["derive"] }
log = "0.4"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
corepc-node = { version = "0.10", features = ["29_0"] }
futures-util = "0.3"
http-body-util = "0.1.3"
ldk-node-lsp = { package = "ldk-node", git = "https://github.com/moneydevkit/ldk-node", rev = "e5fcce065fa97c522de0f8fec87beb9e7e541456" }
tempfile = "3"
tokio-tungstenite = "0.26"
tower = "0.5.3"
