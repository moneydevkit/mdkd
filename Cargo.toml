[package]
name = "mdkd"
version = "0.0.4"
edition = "2021"

[lib]
name = "mdk"
path = "src/lib.rs"

[[bin]]
name = "mdkd"
path = "src/main.rs"

[features]
demo = []

[dependencies]
# Branch: https://github.com/moneydevkit/ldk-node/tree/lsp-0.7.0_accept-underpaying-htlcs_with_timing_logs
ldk-node = { git = "https://github.com/moneydevkit/ldk-node", rev = "f13fcead7e02ef4b77489a83854f204de11e902b" }

# Pinned to the same git rev as ldk-node's transitive pull to avoid duplicate
# crate compilation. Verify with `cargo tree -d | grep bitcoin-payment-instructions`.
bitcoin-payment-instructions = { git = "https://github.com/moneydevkit/bitcoin-payment-instructions", rev = "6796e87525d6c564e1332354a808730e2ba2ebf8", default-features = false, features = ["http"] }

axum = { version = "0.8", features = ["json", "ws"] }
utoipa = { version = "5.4", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "socks"], default-features = false }
rusqlite = { version = "0.31.0", features = ["bundled"] }
hex = { package = "hex-conservative", version = "0.2.1" }
clap = { version = "4", features = ["derive"] }
log = "0.4"
toml = "0.8"
chrono = "0.4"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
corepc-node = { version = "0.10", features = ["29_0"] }
futures-util = "0.3"
http-body-util = "0.1.3"
ldk-node-lsp = { package = "ldk-node", git = "https://github.com/moneydevkit/ldk-node", rev = "e5fcce065fa97c522de0f8fec87beb9e7e541456" }
tempfile = "3"
tokio-tungstenite = "0.26"
tower = "0.5.3"
wiremock = "0.6"
bech32 = "0.11"
