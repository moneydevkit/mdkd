[package]
name = "mdk-server"
version = "0.1.0"
edition = "2021"

[dependencies]
ldk-server = { git = "https://github.com/moneydevkit/ldk-server", rev = "44178d75d509b0156c9e371e190292b3f4930f18" }
ldk-server-protos = { git = "https://github.com/moneydevkit/ldk-server", rev = "44178d75d509b0156c9e371e190292b3f4930f18" }

axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.31.0", features = ["bundled"] }
hex = { package = "hex-conservative", version = "0.2.1" }
clap = { version = "4", features = ["derive"] }
log = "0.4"
getrandom = "0.2"
prost = "0.11.6"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
corepc-node = { version = "0.10", features = ["29_0"] }
http-body-util = "0.1.3"
ldk-node-lsp = { package = "ldk-node", git = "https://github.com/moneydevkit/ldk-node", rev = "e5fcce065fa97c522de0f8fec87beb9e7e541456" }
tempfile = "3"
tower = "0.5.3"
